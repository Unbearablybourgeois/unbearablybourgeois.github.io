<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Unbearably Bourgeois: outfits, scent, skin and dinners for one. A journal by Samuel, new every Saturday.">
<title>Unbearably Bourgeois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&family=Mrs+Saint+Delafield&display=swap">
<style>
/* Layout: magazine masthead centred over a single airy reading column; black and white with a single hairline of oxblood */
:root{
  --paper:#ffffff; --ink:#0d0d0d; --muted:#6b6b6b; --rule:#e2e2e2; --accent:#7a2328; --card:#fafafa;
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body:"Jost", "Futura", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e0e0e; --ink:#f2f2f2; --muted:#9a9a9a; --rule:#2a2a2a; --accent:#d48a90; --card:#151515; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0e0e0e; --ink:#f2f2f2; --muted:#9a9a9a; --rule:#2a2a2a; --accent:#d48a90; --card:#151515; color-scheme:dark}

body{background:var(--paper); color:var(--ink); font-family:var(--body); font-weight:300; font-size:17px; line-height:1.75;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:640px; margin:0 auto; padding-block:56px 80px; display:flex; flex-direction:column; gap:56px}

header{display:flex; flex-direction:column; align-items:center; text-align:center; gap:18px; border-bottom:1px solid var(--ink); padding-bottom:26px}
.byline,.meta,nav button,footer,.label .tag{font-family:var(--body); font-weight:500; font-size:11px; letter-spacing:.24em; text-transform:uppercase}
.byline{color:var(--muted)}
h1{font-family:var(--display); font-weight:400; font-size:clamp(40px, 10vw, 78px); line-height:1; margin:0; letter-spacing:-.015em; text-wrap:balance}
h1 em{font-style:italic}
.tagline{margin:0; color:var(--muted); max-width:42ch; font-size:15px}

nav{display:flex; flex-wrap:wrap; justify-content:center; gap:4px 22px; margin-top:-28px}
nav button{background:none; border:0; padding:6px 0; color:var(--muted); cursor:pointer; border-bottom:1px solid transparent}
nav button:hover{color:var(--ink)}
nav button[aria-pressed="true"]{color:var(--ink); border-bottom-color:var(--ink)}
nav button:focus-visible{outline:1px solid var(--accent); outline-offset:3px}

article{display:flex; flex-direction:column; gap:20px}
.meta{display:flex; flex-wrap:wrap; gap:14px; color:var(--muted)}
.meta .strand{color:var(--accent)}
h2{font-family:var(--display); font-weight:400; font-size:clamp(32px, 6.5vw, 48px); line-height:1.08; margin:0 0 6px; text-wrap:balance}
article p{margin:0; max-width:62ch}
article > p:first-of-type::first-letter{font-family:var(--display); float:left; font-size:3.4em; line-height:.85; padding:6px 10px 0 0}
.sign{display:flex; flex-direction:column; align-items:flex-start; margin-top:16px; font-family:"Mrs Saint Delafield", "Snell Roundhand", "Brush Script MT", cursive; color:var(--ink); line-height:1; transform:rotate(-3deg); transform-origin:left center}
.sign .yours{font-size:44px}
.sign .sig{font-size:68px; margin:-6px 0 0 56px}

.strands{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); border-top:1px solid var(--rule)}
.label{padding:18px 4px; border-bottom:1px solid var(--rule); display:flex; flex-direction:column; gap:4px; min-width:0}
.label .tag{color:var(--accent); font-size:10px}
.label strong{font-family:var(--display); font-weight:400; font-size:22px}
.label span{color:var(--muted); font-size:15px; line-height:1.55}

.next{font-family:var(--display); font-style:italic; color:var(--muted); font-size:19px}
.empty{color:var(--muted); font-family:var(--display); font-style:italic; font-size:19px; text-align:center}
footer{border-top:1px solid var(--rule); padding-top:22px; color:var(--muted); text-align:center; font-size:10px}
main{display:flex; flex-direction:column; gap:64px}
article + article{border-top:1px solid var(--rule); padding-top:56px}
figure{margin:8px 0; display:flex; flex-direction:column; gap:8px}
figure img{width:100%; height:auto; display:block; background:var(--card)}
figcaption{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted)}
.edit{display:flex; flex-direction:column; gap:14px; border-top:1px solid var(--ink); padding-top:22px; margin-top:12px}
.edit h3{font-family:var(--display); font-weight:400; font-size:28px; margin:0}
.edit .tier{font-size:11px; font-weight:500; letter-spacing:.24em; text-transform:uppercase; color:var(--accent); margin:6px 0 0}
.edit ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.edit li{border-bottom:1px solid var(--rule); padding-bottom:10px}
.edit a{color:var(--ink); text-decoration-color:var(--rule); text-underline-offset:3px}
.edit a:hover{text-decoration-color:var(--ink)}
.edit .price{white-space:nowrap; color:var(--muted)}
.edit .note{font-size:13px; color:var(--muted); font-style:italic}
.ph{aspect-ratio:3/4; max-width:100%; border:1px dashed var(--rule); display:grid; place-items:center; color:var(--muted); font-size:11px; letter-spacing:.24em; text-transform:uppercase; text-align:center; padding:16px}
article a{color:inherit}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="byline">A journal by Samuel · New every Saturday</div>
    <h1>Unbearably <em>Bourgeois</em></h1>
    <p class="tagline">Daydreamer, taking getting dressed far too seriously.</p>
  </header>

  <nav aria-label="Filter posts" id="filters"></nav>

  <main id="posts"></main>

  <footer>© 2026 Samuel · New posts every Saturday</footer>
</div>

<script>
const STRANDS = {
  outfit:  {name:"Outfits", desc:"What I actually wore, why it worked, and the pieces I keep going back to."},
  skin:    {name:"Skin & Grooming", desc:"What's on the bathroom shelf right now, and what's earned its place."},
  scent:   {name:"Fragrance", desc:"The scent I'm wearing this week, and the mood it puts me in."},
  wellness:{name:"Wellness", desc:"Moving, resting, and the small rituals that keep me sane."},
  dinners: {name:"Dinners", desc:"The tables worth dressing for, and who I was sat across from."},
  thoughts:{name:"Random Thoughts", desc:"A few things on my mind. Something I spotted, something I'm tempted by."}
};

const POSTS = [
  {
    id:"found-the-one", strand:"outfit", date:"14 November 2026",
    title:"Found the One",
    body:[
      "Yes, I did.",
      {ph:"Photo: Samuel in the coat"},
      "Finding <em>the</em> coat gets harder with age, particularly if you were once, like me, a fully paid-up fashion victim. These days I&rsquo;ve made my peace with monotone. No logos on ready-to-wear; less really is more. I&rsquo;ll allow a little logo on a scarf, and I&rsquo;m still partial to one on a bag. The only logo I&rsquo;ll commit to on clothing is whatever Mrs Prada decides to put there, and we all know why.",
      "Anyway. Back to the one.",
      "It&rsquo;s been exactly a year since I started looking for the perfect coat. Not just any coat: <em>the navy coat.</em> Navy is my uniform and my comfort blanket. Most of my wardrobe comes in it. Very chic, I&rsquo;m told. Mostly by me.",
      "I&rsquo;ve scouted every single week this year, even through that ghastly, endless heatwave. And just like dating, I almost committed a few times. Lovely coats, good on paper, but nothing felt right, and I refuse to settle. Settling is for sofas.",
      "6.50pm on a Friday. Work done, I&rsquo;m edging towards the gym through the mob of Christmas-light worshippers who&rsquo;ve descended on Regent Street, when I think: let me pop into COS. There&rsquo;s a navy coat there I&rsquo;d already tried on and half convinced myself was The One. It had walked their runway, after all.",
      "Upstairs in menswear, there it was. Still gorgeous. And yet, something was off. The spark had gone. I looked at it, it looked at me, and I said, kindly, <em>you are not the one for me.</em> I left it on the rail.",
      "On my way out I thought: Liberty. Their menswear never disappoints, and some of my best pieces have come home from there. So in I went, wandering, praying for something that would speak to me. Something that said: <em>I&rsquo;m navy, I&rsquo;m yours, take me home.</em>",
      "Then, in a split second, there he was. My darling boy. A beautiful raglan-sleeve coat by Oliver Spencer. A burst of happiness so sudden I could have wept, right there between the knitwear.",
      {ph:"Photo: the back pleat"},
      "I tried it on. Exactly what I wanted: an A-line cut with a pleat down the back that swings like a Victorian cloak, and enough room to layer the shit out of it all winter.",
      "So here&rsquo;s my question: why do we keep almost-committing to things that are merely fine, when the one that makes us want to weep in Liberty is out there, waiting on a rail?",
      "Did I make a decision? Yes.<br>Was it financially correct? Does Jesus have a middle name?",
      {html:'<div class="edit"><h3>Navy, for every budget</h3><p>Not everyone&rsquo;s coat budget is a Liberty budget, nor should it be. Good taste has never been about the price tag. Here&rsquo;s how to find your own darling boy at every level.</p><p class="tier">Under £200</p><ul><li><a href="https://www.johnlewis.com/john-lewis-wool-rich-epsom-coat-navy/charcoal/p115252854" target="_blank" rel="noopener">John Lewis Wool Rich Epsom Coat</a> <span class="price">· £169</span><br><span class="note">A clean, grown-up overcoat that does the job beautifully.</span></li><li><a href="https://www.johnlewis.com/white-stuff-witham-wool-rich-overcoat-dark-navy/p115790685" target="_blank" rel="noopener">White Stuff Witham Wool Rich Overcoat</a> <span class="price">· £180</span><br><span class="note">A deeper navy, relaxed and easy to layer.</span></li><li><a href="https://www.johnlewis.com/john-lewis-double-breasted-wool-blend-overcoat-navy/p115612052" target="_blank" rel="noopener">John Lewis Double Breasted Wool Blend Overcoat</a> <span class="price">· £199</span><br><span class="note">For when you want a little more drama.</span></li></ul><p class="tier">Under £300</p><ul><li><a href="https://www.charlestyrwhitt.com/uk/pure-wool-overcoat---navy/OUF0068NAV.html" target="_blank" rel="noopener">Charles Tyrwhitt Pure Wool Overcoat</a> <span class="price">· £299</span><br><span class="note">100% merino at this price is a proper find.</span></li></ul><p class="tier">The investment</p><ul><li><a href="https://uk.sandro-paris.com/en/p/wool-broadcloth-coat/SHPMA00391_211.html" target="_blank" rel="noopener">Sandro Straight-Fit Wool-Blend Coat</a> <span class="price">· £639</span><br><span class="note">Parisian, sharp, and made to last.</span></li></ul><p class="note">Prices at the time of writing.</p></div>'}
    ]
  },
  {
    id:"and-so-it-starts", strand:"thoughts", date:"7 November 2026",
    title:"And so it starts",
    body:[
      "And so it starts.",
      "Café Royal has put its Christmas on, and like any well-dressed guest, it arrived early and overdid it beautifully.",
      "The tree in the lobby is taller than most of my ambitions and better dressed than most men in Mayfair. Red velvet bows, a lot of gold, and a little wooden train parked among the presents like a chauffeur waiting outside the Ritz.",
      {img:"images/cafe-royal-tree.jpg", alt:"A towering Christmas tree with red velvet bows, gold lights and wrapped presents in the Café Royal lobby", caption:"Café Royal, London"},
      "Under the chandelier, a waterfall of crystal that frankly deserves its own security detail, sits a table that looks like the North Pole's post room. Trees built entirely from envelopes, each one sealed in red wax. Frosted firs. A vintage red truck. Two glittering bears who have clearly never worked a day in their lives. I respect them enormously.",
      {img:"images/cafe-royal-chandelier.jpg", alt:"A huge crystal chandelier above a festive table, with a red Santa's Workshop counter behind", caption:"Under the chandelier"},
      "And in the middle, open for anyone to read: Santa's Naughty and Nice book.",
      "Naturally, I checked. I'm on neither list. Either I'm being saved for something special, or I'm simply too interesting to categorise. I've decided it's both.",
      {img:"images/cafe-royal-naughty-nice.jpg", alt:"Frosted mini trees, envelope trees sealed with red wax, a vintage red truck and an open Naughty and Nice book", caption:"The Naughty and Nice book"},
      "Behind it all, the Santa's Workshop counter glows red, and everyone sitting at it already has a glass in hand. As it should be.",
      {img:"images/cafe-royal-santas-workshop.jpg", alt:"The red Santa's Workshop bar with a marble counter, champagne glasses, red lamps and a garland of lights", caption:"Santa's Workshop", w:1600, h:1200},
      "This is my favourite time of year to be unattached. The diary fills itself, every plus-one is my choice, and the best accessory at any party is a man who can leave exactly when he likes.",
      "December rewards effort. Polish the shoes. Wear the good coat. Smell expensive. Arrive as if you meant to.",
      "So here's my question for the season: why save the best version of yourself for a special occasion, when London in December <em>is</em> the occasion?",
      "Consider this your invitation. Dress accordingly.",
      "I hope you're doing something fun this weekend. Even the Grinch is considering cheerful."
    ],
    next:"Next Saturday: a love story. Of sorts."
  },
  {
    id:"getting-dressed-again", strand:"thoughts", date:"6 November 2026",
    title:"Can a man fall back in love with his wardrobe?",
    body:[
      "There's a particular kind of quiet that comes with being single in your thirties. Not lonely, exactly. More like a flat with very good lighting and a wardrobe that has started to read like a list of exes: the coat I bought for someone else's taste, the shoes that were a phase, the jacket I'm still not over.",
      "I used to write about what I wore. Then life got busy, as it does, and the clothes kept happening without the words. So I'm starting again, and this time I'm writing it all down: the outfits, the dates they did or didn't survive, the pieces I keep going back to like a bad habit.",
      "For the record, I'm something of a poster child for manifesting. Write it down, say it out loud, and then, of course, put in the work. Consider this journal me writing it down.",
      "Which got me thinking. Do we dress for the life we have, or for the one we're hoping walks through the door? Most mornings, I suspect it's a bit of both.",
      "Expect outfits, what's on my bathroom shelf, the fragrance I'm wearing that week, dinners worth dressing for, far too many shoes and the occasional confession. A new entry every Saturday. Tell me yours too."
    ],
    showStrands:true
  }
];

let active = "all";
const filtersEl = document.getElementById("filters");
const postsEl = document.getElementById("posts");

function renderFilters(){
  const opts = [["all","All"], ...Object.entries(STRANDS).map(([k,v])=>[k,v.name])];
  filtersEl.innerHTML = "";
  opts.forEach(([k,label])=>{
    const b = document.createElement("button");
    b.type="button"; b.id="f-"+k; b.textContent=label;
    b.setAttribute("aria-pressed", String(active===k));
    b.addEventListener("click", ()=>{ active=k; renderFilters(); renderPosts(); });
    filtersEl.appendChild(b);
  });
}

function renderPosts(){
  const list = POSTS.filter(p=>active==="all" || p.strand===active);
  postsEl.innerHTML = "";
  if(!list.length){
    const p=document.createElement("p"); p.className="empty";
    p.textContent = "Nothing under " + STRANDS[active].name + " yet. It's coming.";
    postsEl.appendChild(p); return;
  }
  list.forEach(post=>{
    const a = document.createElement("article"); a.id = post.id;
    a.innerHTML = `<div class="meta"><span class="strand">${STRANDS[post.strand].name}</span><span>${post.date}</span></div><h2></h2>`;
    a.querySelector("h2").textContent = post.title;
    post.body.forEach(t=>{
      if(t.html){ const d=document.createElement("div"); d.innerHTML=t.html; a.appendChild(d.firstChild); return; }
      if(t.ph){ const d=document.createElement("div"); d.className="ph"; d.textContent=t.ph; a.appendChild(d); return; }
      if(typeof t === "string"){ const p=document.createElement("p"); p.innerHTML=t; a.appendChild(p); return; }
      const f=document.createElement("figure");
      const im=document.createElement("img"); im.src=t.img; im.alt=t.alt; im.loading="lazy"; im.width=t.w||1050; im.height=t.h||1400;
      f.appendChild(im);
      if(t.caption){ const c=document.createElement("figcaption"); c.textContent=t.caption; f.appendChild(c); }
      a.appendChild(f);
    });
    if(post.showStrands){
      const intro=document.createElement("p"); intro.textContent="Here's roughly how it'll go:"; a.appendChild(intro);
      const g=document.createElement("div"); g.className="strands";
      Object.values(STRANDS).forEach(s=>{
        const d=document.createElement("div"); d.className="label";
        d.innerHTML=`<div class="tag">In the journal</div><strong></strong><span></span>`;
        d.querySelector("strong").textContent=s.name; d.querySelector("span").textContent=s.desc;
        g.appendChild(d);
      });
      a.appendChild(g);
    }
    const s=document.createElement("p"); s.className="sign"; s.innerHTML='<span class="yours">Unbearably yours,</span><span class="sig">Samuel</span>'; a.appendChild(s);
    if(post.next){ const n=document.createElement("p"); n.className="next"; n.textContent=post.next; a.appendChild(n); }
    postsEl.appendChild(a);
  });
}
renderFilters(); renderPosts();
</script>

</body>
</html>
